name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wapp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wapp_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wapp -d wapp_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wapp:ci-only-password@127.0.0.1:5432/wapp_test
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CHROME_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Chrome and Linux dependencies
        run: sudo env "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" "$(command -v node)" node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome --install-deps
      - run: npm run test:ui
      - run: git diff --check
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
