server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 24m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location = /nginx-health { access_log off; return 200 'ok'; }
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 240s; }
  location /docs { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location = /integration-guide { proxy_pass http://api:3000; }
  location = /openapi.json { proxy_pass http://api:3000; }
  location = /health { proxy_pass http://api:3000; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
